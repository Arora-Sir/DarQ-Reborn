plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    namespace 'com.kieronquinn.systemstubs'
    compileSdk 36

    defaultConfig {
        minSdkVersion 30
        targetSdkVersion 34
    }

    // The hidden framework interfaces are declared as AIDL, which AGP 8 no longer generates by default.
    buildFeatures {
        aidl true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}