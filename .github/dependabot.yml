version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    # NOTE: Koin 4 changes its API and Gradle 9 needs Android Gradle Plugin 9, so both majors are planned by hand and never arrive as a surprise PR.
    ignore:
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
      - dependency-name: "io.insert-koin:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "androidx.navigation:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # NOTE: WorkManager 2.12 ships Java 11 bytecode, so it waits for the same jvm 11 migration as navigation.
      - dependency-name: "androidx.work:*"
        versions: [">= 2.12"]
