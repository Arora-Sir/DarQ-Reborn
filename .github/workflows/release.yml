name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    # NOTE: Secrets are only reachable from tag pushes in this repository, never from forks or pull requests.
    if: github.repository == 'Arora-Sir/DarQ-Reborn' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    env:
      PACKAGE: com.mohitarora.darqreborn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag commit must be on master
        run: |
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || { echo "Tag $GITHUB_REF_NAME is not on master"; exit 1; }
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Check the tag against the code
        run: |
          VERSION=$(grep -oP "def tagName = '\K[^']+" app/build.gradle)
          CODE=$(grep -oP "versionCode \K[0-9]+" app/build.gradle)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match tagName $VERSION in app/build.gradle"
            exit 1
          fi
          test -f ".github/release-notes/$VERSION.md" || { echo "Missing .github/release-notes/$VERSION.md"; exit 1; }
          test -f scripts/release/signing-lineage.bin || { echo "Missing scripts/release/signing-lineage.bin, run scripts/release/rotate_key.py first"; exit 1; }

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Decode the signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64" || { echo "SIGNING_KEYSTORE_BASE64 is not set in the release environment"; exit 1; }
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build the signed release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain

      # NOTE: Installs signed with the old key (the former debug key) update in place because the APK carries a signing certificate lineage.
      # NOTE: The lineage needs v3 only signing, since v1 and v2 cannot carry it. The minSdk is 29, so every supported device reads v3.
      - name: Sign with the new key and the lineage
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign \
            --v1-signing-enabled false --v2-signing-enabled false --rotation-min-sdk-version 28 \
            --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_KEYSTORE_PASSWORD --key-pass env:SIGNING_KEY_PASSWORD \
            --lineage scripts/release/signing-lineage.bin \
            --out "$RUNNER_TEMP/signed.apk" app/build/outputs/apk/release/app-release.apk

      - name: Verify the APK
        env:
          EXPECTED_CERT_SHA256: ${{ vars.EXPECTED_CERT_SHA256 }}
          OLD_CERT_SHA256: e0ffb2dc934eed434e3a51c2f6ebd7c25d5670d506532a3607ebae83a0f6b3af
        run: |
          test -n "$EXPECTED_CERT_SHA256" || { echo "EXPECTED_CERT_SHA256 variable is not set"; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK="$RUNNER_TEMP/signed.apk"
          "$BT/apksigner" verify "$APK" || { echo "The APK signature does not verify"; exit 1; }
          lower() { tr 'A-F' 'a-f'; }
          CERT=$("$BT/apksigner" verify --print-certs "$APK" | grep -i "certificate SHA-256 digest" | head -1 | awk '{print $NF}' | lower)
          echo "Signer SHA-256: $CERT"
          [ "$CERT" = "$(echo "$EXPECTED_CERT_SHA256" | lower)" ] || { echo "The signing certificate is not the expected one"; exit 1; }
          LINEAGE=$("$BT/apksigner" lineage --in scripts/release/signing-lineage.bin --print-certs | grep "SHA-256 digest" | awk '{print $NF}' | lower)
          echo "$LINEAGE" | head -1 | grep -qx "$OLD_CERT_SHA256" || { echo "The lineage does not start at the old certificate"; exit 1; }
          echo "$LINEAGE" | tail -1 | grep -qx "$(echo "$EXPECTED_CERT_SHA256" | lower)" || { echo "The lineage does not end at the new certificate"; exit 1; }
          BADGING=$("$BT/aapt2" dump badging "$APK")
          echo "$BADGING" | grep -q "package: name='$PACKAGE' versionCode='$VERSION_CODE' versionName='$VERSION'" || { echo "Unexpected package or version"; exit 1; }
          cp "$APK" "DarQ-Reborn.$VERSION.apk"
          sha256sum "DarQ-Reborn.$VERSION.apk" > "DarQ-Reborn.$VERSION.apk.sha256"

      # NOTE: The probe is a tiny white test app. People install it from the release to check that DarQ really darkens an app on their device.
      # NOTE: It has its own package id and no permissions, and it is signed with the same release key.
      - name: Build and sign the probe app
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :forcedarkprobe:assembleRelease --console=plain
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls testing/forcedark-probe/build/outputs/apk/release/*.apk | head -1)
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_KEYSTORE_PASSWORD --key-pass env:SIGNING_KEY_PASSWORD \
            --out "DarQ-Probe.$VERSION.apk" "$UNSIGNED"
          "$BT/apksigner" verify "DarQ-Probe.$VERSION.apk"
          "$BT/aapt2" dump badging "DarQ-Probe.$VERSION.apk" | grep -q "package: name='com.darq.forcedarkprobe'" || { echo "Unexpected probe package"; exit 1; }
          sha256sum "DarQ-Probe.$VERSION.apk" > "DarQ-Probe.$VERSION.apk.sha256"

      - name: Create the draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" --draft --prerelease \
            --title "DarQ Reborn v$VERSION" \
            --notes-file ".github/release-notes/$VERSION.md" \
            "DarQ-Reborn.$VERSION.apk" "DarQ-Reborn.$VERSION.apk.sha256" \
            "DarQ-Probe.$VERSION.apk" "DarQ-Probe.$VERSION.apk.sha256"

      - name: Delete the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
