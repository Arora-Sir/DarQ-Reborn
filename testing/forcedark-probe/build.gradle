// NOTE: Test fixture for device automation and user verification. Released as a standalone zero-dependency APK alongside DarQ.
// NOTE: Its white panel turns dark only when force dark reaches it, which makes screenshot luminance a reliable oracle.
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.darq.forcedarkprobe'
    compileSdk 36

    defaultConfig {
        applicationId "com.darq.forcedarkprobe"
        minSdkVersion 29
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
