plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-parcelize'
    id 'androidx.navigation.safeargs.kotlin'
    id 'com.google.android.gms.oss-licenses-plugin'
}

def tagName = '3.2.0'

android {
    namespace 'com.kieronquinn.app.darq'
    compileSdk 36
    defaultConfig {
        applicationId "com.mohitarora.darqreborn"
        minSdkVersion 29
        targetSdkVersion 34
        versionCode 326
        versionName tagName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField("String", "TAG_NAME", "\"${tagName}\"")
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    buildFeatures {
        viewBinding true
        // AGP 8 turns these off by default. DarQ uses AIDL for its service and BuildConfig fields.
        buildConfig true
        aidl true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
        }
    }

    // NOTE: LSPosed 1.9.2 prefers META-INF/xposed/java_init.list when it exists and then never loads assets/xposed_init, which silently breaks DarQ there.
    // NOTE: Every current manager (LSPosed 1.9.2, its forks, Vector 2.2) loads the legacy entry, so the default build ships only that one.
    // NOTE: Build with -PxposedModernEntry=true to add the LibXposed 101 entry for Vector and LSPosed 2.x.
    if (project.findProperty('xposedModernEntry') == 'true') {
        sourceSets.main.resources.srcDir 'src/xposedModern/resources'
    }
}

dependencies {

    //Kotlin + Coroutines
    def kotlinx_coroutines_version = "1.6.0"
    implementation"org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlinx_coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlinx_coroutines_version"

    //Koin
    def koin_version= "3.1.5"
    implementation "io.insert-koin:koin-android:$koin_version"
    implementation "io.insert-koin:koin-androidx-navigation:$koin_version"

    //AndroidX
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation "androidx.fragment:fragment-ktx:1.4.1"
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation "androidx.work:work-runtime-ktx:2.7.1"

    //Navigation Component
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    //Lifecycle
    def lifecycle_version = "2.4.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-service:$lifecycle_version"

    //Material
    implementation 'com.google.android.material:material:1.12.0'

    //Network
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    //Sunrise/sunset calculator
    implementation 'org.shredzone.commons:commons-suncalc:2.4'

    //Play Services OSS
    implementation 'com.google.android.gms:play-services-oss-licenses:17.0.0'
    implementation "ru.noties.markwon:core:3.0.2"

    //Preference Support
    implementation 'androidx.preference:preference-ktx:1.2.0'

    //libsu (root service)
    def libsuVersion = '3.2.1'
    implementation "com.github.topjohnwu.libsu:core:$libsuVersion"
    implementation "com.github.topjohnwu.libsu:service:$libsuVersion"

    //Shizuku (non-root service)
    def shizuku_version = '13.1.5'
    implementation "dev.rikka.shizuku:api:$shizuku_version"
    implementation "dev.rikka.shizuku:provider:$shizuku_version"

    //Xposed: the legacy API (82) entry ships by default, the LibXposed (101) entry only with -PxposedModernEntry=true.
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'io.github.libxposed:api:101.0.1'
    implementation 'io.github.libxposed:service:101.0.0'

    //Bypass Hidden APIs
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.2'

    //Stubs for hidden APIs used by service. Shouldn't be included in APK.
    compileOnly project(':systemstubs')

    //Unit tests
    testImplementation 'junit:junit:4.13.2'
    //android.jar only stubs org.json, so the real implementation is used on the JVM
    testImplementation 'org.json:json:20240303'
    //Robolectric runs the theme tests, which need real Android color math and theme resolution
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'

}

