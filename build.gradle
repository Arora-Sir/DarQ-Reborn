// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '2.4.21'
    // Runtime navigation libraries stay on 2.4.1. Only the safe-args plugin moves, because 2.4.1 does not load on AGP 8.
    ext.nav_version = "2.4.1"
    ext.nav_plugin_version = "2.8.9"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$nav_plugin_version"
        classpath 'com.google.android.gms:oss-licenses-plugin:0.10.6'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url 'https://api.xposed.info/' }
        //Jcenter is still required for Xposed
        jcenter()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
